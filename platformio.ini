[platformio]
default_envs = esp32-s3

[esp32_base]
platform = espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
lib_ldf_mode = deep+
extra_scripts = pre:scripts/framework_paths.py
lib_deps =
    FS
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.3
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DVAULTKEY_FIRMWARE_VERSION=\"0.1.0-prototype\"
    -DVAULTKEY_HARDWARE_VERSION=\"rev-E\"
    -Wall
    -Wextra
    -Werror=return-type
monitor_filters = esp32_exception_decoder

[env:esp32-s3]
extends = esp32_base
board_upload.flash_size = 8MB

[env:esp32-s3-4mb]
extends = esp32_base
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = yes
build_src_filter =
    +<core/TimeUtils.cpp>
    +<authenticator/HOTP.cpp>
    +<authenticator/TOTP.cpp>
    +<authenticator/OtpAuth.cpp>
    +<vault/RecordCodec.cpp>
    +<security/Crypto.cpp>
build_flags =
    -DVAULTKEY_HOST_TEST=1
    -std=gnu++17
    -Wall
    -Wextra
    -Werror=return-type
    -lcrypto
